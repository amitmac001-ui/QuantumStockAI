<section class="space-y-4">

    <div class="glass rounded-2xl p-5">

        <div class="mb-5 flex items-center justify-between">

            <div>

                <h2 class="text-lg font-bold text-white">
                    Latest News
                </h2>

                <p class="mt-1 text-xs text-slate-400">
                    Live Market Updates
                </p>

            </div>

            <a href="{% url 'news:list' %}"
               class="text-sm font-medium text-indigo-400 hover:text-indigo-300">

                View All

            </a>

        </div>

        {% for article in latest_news|slice:":5" %}

        <article class="border-b border-slate-800 py-4 last:border-0">

            <a href="{% url 'news:detail' article.slug %}"
               class="block">

                <h3 class="line-clamp-2 font-semibold text-white hover:text-indigo-400 transition">

                    {{ article.title }}

                </h3>

                <div class="mt-2 flex items-center justify-between text-xs text-slate-500">

                    <span>

                        {{ article.source }}

                    </span>

                    <span>

                        {{ article.published_at|timesince }} ago

                    </span>

                </div>

                {% if article.summary %}

                <p class="mt-3 line-clamp-2 text-sm leading-6 text-slate-400">

                    {{ article.summary }}

                </p>

                {% endif %}

            </a>

        </article>

        {% empty %}

        <div class="rounded-xl border border-dashed border-slate-700 py-10 text-center">

            <p class="text-slate-500">

                No News Available

            </p>

        </div>

        {% endfor %}

    </div>

</section>
