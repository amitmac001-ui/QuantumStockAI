<section>

    <form
        action="{% url 'companies:search' %}"
        method="get">

        <div class="relative">

            <svg
                xmlns="http://www.w3.org/2000/svg"
                class="absolute left-4 top-1/2 h-5 w-5 -translate-y-1/2 text-slate-500"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor">

                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M21 21l-4.35-4.35m1.35-5.65a7 7 0 11-14 0 7 7 0 0114 0z"/>

            </svg>

            <input
                type="search"
                name="q"
                autocomplete="off"
                placeholder="Search Stocks (RELIANCE, TCS, INFY...)"
                class="w-full rounded-2xl border border-slate-800 bg-slate-900 py-4 pl-12 pr-4 text-white placeholder:text-slate-500 focus:border-indigo-500 focus:outline-none"/>

        </div>

    </form>

</section>
