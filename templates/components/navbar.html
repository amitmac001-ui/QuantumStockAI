<header class="topbar">
    <div class="topbar__inner">
        <button class="icon-button" id="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false">
            <span aria-hidden="true">☰</span>
        </button>
        <a href="{% url 'dashboard:home' %}" class="brand" aria-label="QuantumStock AI dashboard">
            <span class="brand__mark">Q</span>
            <span>QuantumStock <strong>AI</strong></span>
        </a>
        <div class="topbar-search">
            <label class="sr-only" for="dashboard-search">Search stocks, sectors or indices</label>
            <input id="dashboard-search" type="search" autocomplete="off" placeholder="Search stocks, sectors or indices…" aria-controls="search-results" aria-expanded="false">
            <div class="search-results" id="search-results" hidden></div>
            <span class="topbar-search__selection" id="search-selection" aria-live="polite"></span>
        </div>
        <div class="topbar__account">
            <span class="topbar__email">{{ request.user.email }}</span>
            <form method="post" action="{% url 'website-logout' %}">
                {% csrf_token %}
                <button class="button button--quiet" type="submit">Log out</button>
            </form>
        </div>
    </div>
</header>
